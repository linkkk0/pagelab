<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>遐蝶角色介绍 - Honkai Star Rail Style</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.page{position:relative;width:100vw;height:100vh;background:
linear-gradient(90deg,rgba(255,255,255,.12),transparent 35%),
linear-gradient(120deg,#d8d5c9,#53606b,#10151b);overflow:hidden}

.bgText{position:absolute;left:4%;top:8%;font-size:9vw;font-weight:900;
letter-spacing:.08em;color:rgba(255,255,255,.15);animation:moveText 8s linear infinite}

.title{position:absolute;left:8%;top:32%;z-index:5;animation:fadeIn 1.2s}
.cn{font-size:48px;font-weight:900;letter-spacing:.15em}
.en{font-size:30px;font-weight:bold;letter-spacing:.1em}
.line{width:230px;height:3px;background:white;margin:18px 0}

.character{
position:absolute;right:5%;bottom:-5%;height:90%;
filter:drop-shadow(0 0 30px rgba(255,255,255,.5));
animation:float 4s ease-in-out infinite,show 1.5s;
}
/* 替换为遐蝶立绘 */
.character img{height:100%;}

.light{
position:absolute;width:800px;height:800px;border-radius:50%;
right:-200px;top:-250px;
background:radial-gradient(circle,rgba(255,220,120,.5),transparent 65%);
animation:pulse 3s infinite;
}
.particles span{
position:absolute;width:5px;height:5px;background:white;border-radius:50%;
animation:rise 5s infinite;
opacity:.7
}
.mask{position:absolute;inset:0;background:#000;
animation:open 1.8s forwards;z-index:20}

@keyframes open{to{transform:translateY(-100%)}}
@keyframes fadeIn{from{opacity:0;transform:translateX(-80px)}}
@keyframes show{from{opacity:0;transform:translateX(120px)}}
@keyframes float{50%{transform:translateY(-20px)}}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
@keyframes moveText{to{transform:translateX(-80px)}}
@keyframes rise{
from{transform:translateY(100vh)}
to{transform:translateY(-20vh)}
}
</style>
</head>
<body>
<div class="page">
<div class="mask"></div>
<div class="bgText">GLORY BELONGS TO US</div>
<div class="light"></div>

<div class="title">
<div class="cn">遐蝶</div>
<div class="en">GLORY BELONGS TO US</div>
<div class="line"></div>
<div>记忆 / 角色档案</div>
</div>

<div class="character">
<!-- 放入遐蝶透明立绘，例如 xiadie.png -->
<img src="lihui.png">
</div>

<div class="particles">
<span style="left:15%;animation-delay:1s"></span>
<span style="left:35%;animation-delay:3s"></span>
<span style="left:65%;animation-delay:2s"></span>
<span style="left:80%;animation-delay:4s"></span>
</div>
</div>
</body>
</html>
