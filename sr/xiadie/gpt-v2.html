<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>遐蝶 Character Intro - Inner Light</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#05030d;font-family:"Microsoft YaHei",sans-serif}

.scene{
width:100vw;height:100vh;position:relative;overflow:hidden;
background:
radial-gradient(circle at 75% 45%,rgba(190,120,255,.45),transparent 35%),
linear-gradient(120deg,#080511,#28104d,#05030d);
}

.mask{
position:absolute;inset:0;background:#000;z-index:20;
animation:open 1.5s forwards;
}
@keyframes open{to{transform:translateY(-100%)}}

.bg{
position:absolute;top:8%;left:5%;
font-size:150px;font-weight:900;
letter-spacing:20px;
color:rgba(255,255,255,.04);
animation:bgMove 12s linear infinite;
}
@keyframes bgMove{to{transform:translateX(-120px)}}

.beam{
position:absolute;top:55%;left:-40%;
width:45%;height:4px;
background:linear-gradient(90deg,transparent,#fff,#c678ff,transparent);
box-shadow:0 0 40px #c678ff;
animation:beamMove 2s .5s forwards;
}
@keyframes beamMove{to{left:130%;opacity:0}}

.hero{
position:absolute;
right:-5%;bottom:-8%;
width:75%;
animation:heroIn 2s ease forwards,float 5s 2s infinite;
}
@keyframes heroIn{
from{
opacity:0;
transform:translateX(150px) scale(1.1);
filter:blur(20px)
}
}
@keyframes float{50%{transform:translateY(-15px)}}


.name{
position:absolute;
left:8%;
top:30%;
z-index:5;
}

.cn{
font-size:90px;
font-weight:900;
letter-spacing:25px;
opacity:0;
transform:translateX(-120px) scale(1.5);
animation:nameShow 1.8s .7s forwards;
}

.cn span{
display:inline-block;
color:transparent;

background:
linear-gradient(
120deg,
#ffffff 0%,
#ffffff 25%,
#d8b7ff 35%,
#ffffff 45%,
#9d55ff 50%,
#ffffff 60%,
#ffffff 100%
);

background-size:250% 100%;

-webkit-background-clip:text;
background-clip:text;

filter:
drop-shadow(0 0 12px #c77cff)
drop-shadow(0 0 30px rgba(180,100,255,.7));

animation:innerLight 5s linear infinite;
}

@keyframes innerLight{
0%{background-position:200% center}
50%{background-position:0% center}
100%{background-position:-200% center}
}

@keyframes nameShow{
0%{
opacity:0;
filter:blur(40px) drop-shadow(0 0 60px #d38cff)
}
60%{
opacity:1;
filter:blur(0) drop-shadow(0 0 45px #d38cff)
}
100%{
opacity:1;
transform:translateX(0) scale(1);
filter:drop-shadow(0 0 15px #d38cff)
}
}


/* 蝴蝶从文字内部爆散 */
.butterflyBurst{
position:absolute;
left:50%;
top:50%;
width:20px;height:20px;
}

.butterflyBurst span{
position:absolute;
width:22px;height:16px;
background:radial-gradient(ellipse,#fff,#d69cff 45%,transparent 70%);
filter:drop-shadow(0 0 12px #c87cff);
opacity:0;
animation:burst 3s 1s ease-out forwards;
}

.butterflyBurst span:nth-child(1){--x:-180px;--y:-130px}
.butterflyBurst span:nth-child(2){--x:170px;--y:-150px}
.butterflyBurst span:nth-child(3){--x:-230px;--y:20px}
.butterflyBurst span:nth-child(4){--x:220px;--y:40px}
.butterflyBurst span:nth-child(5){--x:-100px;--y:150px}
.butterflyBurst span:nth-child(6){--x:120px;--y:170px}
.butterflyBurst span:nth-child(7){--x:30px;--y:-220px}
.butterflyBurst span:nth-child(8){--x:-40px;--y:220px}

@keyframes burst{
0%{opacity:0;transform:translate(0,0) scale(.1)}
15%{opacity:1;transform:scale(1.2)}
70%{opacity:1;transform:translate(var(--x),var(--y)) rotate(90deg)}
100%{opacity:0;transform:translate(calc(var(--x)*1.3),calc(var(--y)*1.3)) scale(.2)}
}


.en{
margin-top:15px;
font-size:32px;
letter-spacing:18px;
color:#eadcff;
opacity:0;
transform:translateY(40px);
animation:enShow 1.5s 1.4s forwards;
}

@keyframes enShow{to{opacity:1;transform:translateY(0)}}

.line{
margin-top:20px;
width:260px;height:2px;
background:white;
box-shadow:0 0 20px #d58cff;
}

.particle{
position:absolute;
width:8px;height:8px;
background:#e3c0ff;
border-radius:50%;
box-shadow:0 0 20px #d98cff;
animation:particle 6s infinite;
}

@keyframes particle{
from{transform:translateY(100vh)}
to{transform:translateY(-20vh)}
}
</style>
</head>

<body>
<div class="scene">
<div class="mask"></div>
<div class="bg">CASTORICE</div>
<div class="beam"></div>

<div class="name">
<div class="cn">
<span>遐蝶</span>
<div class="butterflyBurst">
<span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span>
</div>
</div>

<div class="en">CASTORICE</div>
<div class="line"></div>
</div>

<img class="hero" src="lihui.png">

<div class="particle" style="left:20%;animation-delay:1s"></div>
<div class="particle" style="left:40%;animation-delay:3s"></div>
<div class="particle" style="left:70%;animation-delay:2s"></div>
<div class="particle" style="left:85%;animation-delay:4s"></div>

</div>
</body>
</html>
