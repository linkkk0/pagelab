<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希儿·芙乐艾 - 死生之律者</title>
    <style>
        /* ================= 基础与色调设定 ================= */
        :root {
            --bg-deep: #05070e;
            --primary-blue: #7bb5ff;
            --glow-cyan: #aee5ff;
            --purple-light: #d3c4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: #ffffff;
        }

        /* ================= 1. 史诗级加载动画 ================= */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #0c1427 0%, #030509 100%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
        }

        .loader-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(174, 229, 255, 0.6);
            border-radius: 50%;
            animation: spinFast 8s linear infinite;
            box-shadow: 0 0 30px rgba(123, 181, 255, 0.2);
        }

        .ring-inner {
            position: absolute;
            width: 75%;
            height: 75%;
            border: 2px solid transparent;
            border-top: 3px solid var(--purple-light);
            border-bottom: 3px solid var(--glow-cyan);
            border-radius: 50%;
            animation: spinReverse 4s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
        }

        .loader-core {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 25px 10px var(--glow-cyan), 0 0 50px 20px var(--purple-light);
            animation: corePulse 1.5s ease-in-out infinite alternate;
        }

        .loader-text {
            margin-top: 40px;
            font-size: 0.95rem;
            letter-spacing: 6px;
            color: var(--glow-cyan);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-blue);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes spinFast { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes corePulse {
            0% { transform: scale(0.6); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
        @keyframes textGlow {
            0% { opacity: 0.3; filter: blur(2px); }
            100% { opacity: 1; filter: blur(0px); }
        }

        #loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* ================= 2. 背景与法阵 ================= */
        .bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 50%, #111a30 0%, #080d1a 50%, #020307 100%);
            z-index: 1;
        }

        .magic-array {
            position: absolute;
            top: 50%;
            left: 28%;
            transform: translate(-50%, -50%);
            width: 850px;
            height: 850px;
            border: 1px solid rgba(174, 229, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: rotateBg 50s linear infinite;
        }
        .magic-array::before {
            content: '';
            position: absolute;
            top: 5%; left: 5%; right: 5%; bottom: 5%;
            border: 2px dashed rgba(211, 196, 255, 0.2);
            border-radius: 50%;
        }

        @keyframes rotateBg { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        canvas#particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* ================= 3. 左侧角色立绘（专门强化左侧边缘模糊） ================= */
        .character-stage {
            position: absolute;
            left: 3vw;
            top: 0;
            width: 52vw;
            height: 100vh;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .aura-glow {
            position: absolute;
            width: 580px;
            height: 580px;
            background: radial-gradient(circle, rgba(174,229,255,0.45) 0%, rgba(211,196,255,0.2) 40%, transparent 70%);
            filter: blur(80px);
            animation: pulseGlow 5s ease-in-out infinite alternate;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .floating-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatAnim 6s ease-in-out infinite 2s;
        }

        /* 核心修补重点：通过多层 mask-image 彻底融化左侧和四周边缘 */
        .character-img {
            max-height: 88vh;
            max-width: 100%;
            object-fit: contain;

            /* 1. 双重掩码：复合线性渐变（专门针对左边缘深度羽化）+ 环形渐变（四周羽化） */
            -webkit-mask-image: 
                linear-gradient(to right, transparent 0%, black 22%, black 88%, transparent 100%),
                radial-gradient(circle at 50% 50%, black 50%, transparent 92%);
            -webkit-mask-composite: source-in;

            mask-image: 
                linear-gradient(to right, transparent 0%, black 22%, black 88%, transparent 100%),
                radial-gradient(circle at 50% 50%, black 50%, transparent 92%);
            mask-composite: intersect;

            /* 2. 增强多重光影，模糊边界 */
            filter: drop-shadow(-15px 0 25px rgba(174, 229, 255, 0.4))
                    drop-shadow(15px 0 30px rgba(123, 181, 255, 0.3))
                    brightness(1.03);

            opacity: 0;
            transform: scale(0.7) translateY(60px);
            transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 1.5s ease, 
                        filter 1.8s ease;
            cursor: pointer;
        }

        .character-stage.enter .character-img {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .character-stage.enter .aura-glow {
            opacity: 1;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 0.8; transform: scale(1.1); }
        }

        /* ================= 4. 右侧展示面板 ================= */
        .right-panel {
            position: absolute;
            right: 5vw;
            top: 0;
            width: 38vw;
            height: 100vh;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            pointer-events: none;
        }

        .header-box {
            opacity: 0;
            transform: translateX(40px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s;
        }

        .header-box.enter {
            opacity: 1;
            transform: translateX(0);
        }

        .role-tag {
            display: inline-block;
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--glow-cyan);
            padding: 4px 12px;
            border: 1px solid rgba(174, 229, 255, 0.3);
            background: rgba(123, 181, 255, 0.08);
            border-radius: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .main-title {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff 20%, var(--glow-cyan) 60%, var(--purple-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(123, 181, 255, 0.2);
        }

        .sub-title {
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: var(--purple-light);
            margin-top: 8px;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .status-cards {
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transform: translateX(40px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.9s;
        }

        .status-cards.enter {
            opacity: 1;
            transform: translateX(0);
        }

        .card-item {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid var(--glow-cyan);
            padding: 18px 24px;
            border-radius: 0 12px 12px 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), var(--glow-cyan));
            width: 100%;
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .decor-ring {
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 320px;
            height: 320px;
            border: 1px dashed rgba(174, 229, 255, 0.15);
            border-radius: 50%;
            animation: spinFast 35s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-wrapper">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="loader-core"></div>
        </div>
        <div class="loader-text">Herrscher of Rebirth</div>
    </div>

    <div class="bg-container">
        <div class="magic-array"></div>
    </div>
    
    <canvas id="particles"></canvas>

    <div class="character-stage" id="charStage">
        <div class="aura-glow"></div>
        <div class="floating-wrapper">
            <img src="lihui.png" alt="死生之律者 - 希儿" class="character-img" id="heroImg">
        </div>
    </div>

    <div class="right-panel">
        <div class="header-box" id="headerBox">
            <span class="role-tag">S-Rank Valkyrie</span>
            <h1 class="main-title">希儿·芙乐艾</h1>
            <div class="sub-title">HERRSCHER OF REBIRTH · 死生之律者</div>
        </div>

        <div class="status-cards" id="statusCards">
            <div class="card-item">
                <div class="card-label">权能形态 / AUTHORITY FORM</div>
                <div class="card-value">
                    <span>塑灵与结命之双生</span>
                    <span style="color: var(--glow-cyan); font-size: 0.9rem;">[ Active ]</span>
                </div>
                <div class="progress-bar"><div class="progress-inner"></div></div>
            </div>

            <div class="card-item" style="border-left-color: var(--purple-light);">
                <div class="card-label">生命的温床 / REBIRTH RESONANCE</div>
                <div class="card-value">
                    <span>纯白绽放 · 凋零与新芽</span>
                    <span style="color: var(--purple-light); font-size: 0.9rem;">99.8%</span>
                </div>
                <div class="progress-bar"><div class="progress-inner" style="background: linear-gradient(90deg, var(--purple-light), #ffffff);"></div></div>
            </div>

            <div class="card-item">
                <div class="card-label">核心波动 / CORE FREQUENCY</div>
                <div class="card-value">
                    <span>海洋与量子之海的共鸣</span>
                    <span style="color: var(--glow-cyan); font-size: 0.9rem;">Stable</span>
                </div>
            </div>
        </div>

        <div class="decor-ring"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            const charStage = document.getElementById('charStage');
            const headerBox = document.getElementById('headerBox');
            const statusCards = document.getElementById('statusCards');

            setTimeout(() => {
                loader.classList.add('fade-out');
                setTimeout(() => {
                    charStage.classList.add('enter');
                    headerBox.classList.add('enter');
                    statusCards.classList.add('enter');
                }, 300);
            }, 1200);
        });

        // 粒子系统
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class PetalParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 3.5 + 1.2;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.03;
                this.alpha = Math.random() * 0.7 + 0.3;
                this.color = Math.random() > 0.4 ? '#aee5ff' : '#d3c4ff';
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y < -20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 2, 0, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 85 }, () => new PetalParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // 3D 视差
        const heroImg = document.getElementById('heroImg');
        document.addEventListener('mousemove', (e) => {
            if (!charStage.classList.contains('enter')) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            heroImg.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
